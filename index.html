<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculadora">
        <div class="icone">✦</div>

        <h1>Calculadora</h1>
        <p class="subtitulo">Calcule de maneira simples e rápida.</p>

        <label for="numero1">Primeiro número</label>
        <input type="number" id="numero1" step="any"
               placeholder="Digite o primeiro número">

        <label for="numero2">Segundo número</label>
        <input type="number" id="numero2" step="any"
               placeholder="Digite o segundo número">

        <div class="operacoes">
            <button type="button" data-operacao="somar">＋ Somar</button>
            <button type="button" data-operacao="subtrair">− Subtrair</button>
            <button type="button" data-operacao="multiplicar">× Multiplicar</button>
            <button type="button" data-operacao="dividir">÷ Dividir</button>
        </div>

        <section class="painel-resultado">
            <span>RESULTADO</span>
            <p id="resultado" aria-live="polite">
                O resultado aparecerá aqui.
            </p>
        </section>

        <button type="button" id="limpar" class="botao-limpar">
            Limpar calculadora
        </button>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Pro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="calculadora">
        <div class="icone">✦</div>
        <h1>Calculadora</h1>
        <p class="subtitulo">Seus cálculos de forma simples.</p>

        <label for="numero1">Primeiro número</label>
        <input type="number" id="numero1" step="any"
               placeholder="Digite um número">

        <label for="numero2">Segundo número</label>
        <input type="number" id="numero2" step="any"
               placeholder="Digite outro número">

        <div class="operacoes">
            <button onclick="calcular('somar')">＋ Somar</button>
            <button onclick="calcular('subtrair')">− Subtrair</button>
            <button onclick="calcular('multiplicar')">× Multiplicar</button>
            <button onclick="calcular('dividir')">÷ Dividir</button>
        </div>

        <div class="painel-resultado">
            <span>RESULTADO</span>
            <p id="resultado" aria-live="polite">
                O resultado aparecerá aqui.
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
